name: home-inventory

# Download the source, copy .env.example to .env, set APP_ORIGIN, then run:
#   docker compose up -d --build
# The same app image also runs backups and the optional AI queue worker.
x-app-image: &app-image
  image: ${IMAGE_REF:-home-inventory:local}
  build:
    context: .
    target: runner
  pull_policy: ${IMAGE_PULL_POLICY:-build}

x-runtime: &runtime
  user: "1000:1000"
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  init-data:
    <<: *app-image
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/scripts/init-data.sh"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    volumes:
      - inventory-data:/data
      - inventory-backups:/backups
      - inventory-models:/models
    mem_limit: 64m
    cpus: 0.25

  app:
    <<: [*app-image, *runtime]
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:?Copy .env.example to .env and set APP_ORIGIN to the address phones will use}
      AI_URL: ${AI_URL:-}
      AI_MODEL: ${AI_MODEL:-qwen3-vl:2b-instruct-q4_K_M}
      INVENTORY_DATA_DIR: /data
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:3000"
    volumes:
      - inventory-data:/data
    tmpfs:
      - /tmp:size=${APP_TMP_SIZE:-512m},uid=1000,gid=1000,mode=1770
    mem_limit: 1g
    cpus: 1.50
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backups:
    <<: [*app-image, *runtime]
    entrypoint: ["/bin/sh", "/app/scripts/backup-loop.sh"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      INVENTORY_DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_STARTUP_DELAY_SECONDS: ${BACKUP_STARTUP_DELAY_SECONDS:-300}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - inventory-data:/data
      - inventory-backups:/backups
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000,mode=1770
    mem_limit: 384m
    cpus: 0.50
    healthcheck:
      disable: true

  ollama:
    <<: *runtime
    profiles: [ai]
    image: ollama/ollama:0.35.1@sha256:17e945f1aa6e505707eeb621e3f36847d0a4a063d4778f7007645acccfb8bd4f
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      HOME: /tmp/ollama
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_LOAD_TIMEOUT: 120s
    volumes:
      - inventory-models:/models
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000,mode=1770
    mem_limit: ${AI_MEMORY_LIMIT:-4g}
    memswap_limit: ${AI_MEMORY_LIMIT:-4g}
    cpus: ${AI_CPU_LIMIT:-2}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ai-worker:
    <<: [*app-image, *runtime]
    profiles: [ai]
    command: ["node", "/app/scripts/ai-worker.cjs"]
    stop_grace_period: 330s
    depends_on:
      app:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AI_URL: ${AI_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen3-vl:2b-instruct-q4_K_M}
      INVENTORY_DATA_DIR: /data
    volumes:
      - inventory-data:/data
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000,mode=1770
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "node", "/app/scripts/ai-worker.cjs", "--health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  inventory-data:
  inventory-backups:
  inventory-models:
